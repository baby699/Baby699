
services:
  - type: web
    name: secretbox
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: DB_PATH
        value: /tmp/secretbox.sqlite3
      - key: MAX_AGE_HOURS
        value: "168"
      - key: PUBLIC_BASE_URL
        sync: false
